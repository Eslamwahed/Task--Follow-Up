<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل المهام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --r:12px; --r-sm:8px;
}
[data-theme="light"]{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#F8FAF8;
  --ink:#16201C; --muted:#6B7772;
  --rule:#E4E9E5; --rule-strong:#D2D9D4;
  --accent:#2F5D50; --accent-ink:#FFFFFF; --accent-soft:#E5EEE9;
  --topbar:#22463C; --topbar-ink:#EFF4F1;
  --done:#4A7A5E; --warn:#B4722A; --late:#A8443A; --late-bg:#FBEDEB;
  --shadow:0 1px 2px rgba(22,32,28,.04), 0 6px 20px rgba(22,32,28,.05);
}
[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1B; --surface-2:#1E2723;
  --ink:#E7ECE9; --muted:#8E9A94;
  --rule:#28322D; --rule-strong:#3A463F;
  --accent:#68AE94; --accent-ink:#0F1412; --accent-soft:#1F302A;
  --topbar:#141B18; --topbar-ink:#E7ECE9;
  --done:#68AE94; --warn:#D0A063; --late:#DE7F74; --late-bg:#2B1E1C;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:15.5px;line-height:1.65;
  font-variant-numeric:tabular-nums;
  transition:background .2s, color .2s;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- header ---------- */
.top{
  background:var(--topbar);color:var(--topbar-ink);
  padding:18px 34px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.brand{font-weight:700;font-size:19px;letter-spacing:-.01em;line-height:1.3}
.brand small{display:block;font-weight:400;font-size:12.5px;opacity:.6;letter-spacing:0;margin-top:1px}
.top .spacer{flex:1}
.who{
  display:flex;align-items:center;gap:9px;font-size:14px;
  background:rgba(255,255,255,.09);padding:7px 14px;border-radius:100px;
}
.who b{font-weight:600}
.who button{color:inherit;opacity:.6;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.who button:hover{opacity:1}
.icon-btn{
  width:38px;height:38px;border-radius:100px;color:inherit;
  display:grid;place-items:center;background:rgba(255,255,255,.09);
}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn-new{
  background:var(--topbar-ink);color:var(--topbar);font-weight:600;font-size:14.5px;
  padding:10px 20px;border-radius:var(--r-sm);
}
.btn-new:hover{opacity:.88}

/* ---------- ledger strip ---------- */
.ledger{
  display:flex;background:var(--surface);border-bottom:1px solid var(--rule);
  overflow-x:auto;
}
.cell{
  flex:1;min-width:150px;padding:22px 30px;
  display:flex;align-items:baseline;gap:11px;
  border-inline-start:1px solid var(--rule);
}
.cell:first-child{border-inline-start:none}
.cell .n{font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em}
.cell .l{font-size:13.5px;color:var(--muted)}
.cell.is-late{background:var(--late-bg)}
.cell.is-late .n,.cell.is-late .l{color:var(--late)}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start;max-width:1340px;margin:0 auto}
.rail{width:250px;flex:none;padding:34px 26px 70px;position:sticky;top:0}
.rail h3{font-size:12.5px;font-weight:600;color:var(--muted);margin:28px 0 10px}
.rail h3:first-child{margin-top:0}
.rail label{display:block;margin-bottom:3px}
.rail label input{position:absolute;opacity:0;pointer-events:none}
.rail label span{display:block;padding:8px 13px;border-radius:var(--r-sm);font-size:14.5px}
.rail label:hover span{background:var(--surface)}
.rail label input:checked + span{background:var(--accent);color:var(--accent-ink);font-weight:500}
.rail label input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.search{
  width:100%;padding:11px 14px;border:1px solid var(--rule-strong);border-radius:var(--r-sm);
  background:var(--surface);font-size:14.5px;
}
.search::placeholder{color:var(--muted);opacity:.75}
.list{flex:1;min-width:0;padding:34px 30px 90px}

/* ---------- group ---------- */
.group{margin-bottom:38px}
.group-head{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:0 4px 12px;margin-bottom:14px;
  border-bottom:1px solid var(--rule);text-align:start;color:inherit;
}
.group-head .t{font-size:15px;font-weight:600}
.group-head .c{
  font-size:12.5px;color:var(--muted);background:var(--surface);
  padding:1px 9px;border-radius:100px;border:1px solid var(--rule);
}
.group-head .chev{margin-inline-start:auto;color:var(--muted);font-size:12px;transition:transform .18s}
.group.closed .chev{transform:rotate(-90deg)}
.group.closed .rows{display:none}
.group[data-k="late"] .group-head .t{color:var(--late)}
.rows{display:flex;flex-direction:column;gap:10px}

/* ---------- item ---------- */
.item{
  background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);
  border-inline-start:4px solid var(--rule-strong);overflow:hidden;
}
.item[data-s="جارية"]{border-inline-start-color:var(--accent)}
.item[data-s="خلصت"]{border-inline-start-color:var(--done)}
.item[data-s="متوقفة"]{border-inline-start-color:var(--warn)}
.item.late{border-inline-start-color:var(--late)}
.row{display:flex;align-items:flex-start;gap:16px;padding:17px 20px}
.row .main{flex:1;min-width:0;text-align:start;color:inherit}
.row .title{font-size:15.5px;font-weight:500;line-height:1.5}
.item[data-s="خلصت"] .title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.row .meta{font-size:13px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:5px 18px}
.row .meta .due.late{color:var(--late);font-weight:600}
.row .meta .due.soon{color:var(--warn);font-weight:600}
.row .meta .pri{color:var(--late);font-weight:600}
.st{
  flex:none;border:1px solid var(--rule-strong);border-radius:var(--r-sm);
  padding:7px 11px;font-size:13.5px;background:var(--surface-2);
}

/* ---------- detail ---------- */
.detail{background:var(--surface-2);border-top:1px solid var(--rule);padding:18px 20px;font-size:14.5px}
.detail .notes{white-space:pre-wrap;color:var(--ink);opacity:.85;padding-bottom:14px;max-width:70ch}
.detail .notes:empty{display:none}
.detail dl{display:flex;flex-wrap:wrap;gap:6px 30px;font-size:13px;color:var(--muted);padding-bottom:14px}
.detail dl div{display:flex;gap:7px}
.detail dl b{font-weight:500;color:var(--ink)}
.locked{font-size:13px;color:var(--muted);font-style:normal}
.st:disabled{opacity:.55;cursor:not-allowed;background:transparent}
.acts{display:flex;gap:10px}
.acts button{
  font-size:13.5px;padding:7px 16px;border:1px solid var(--rule-strong);
  border-radius:var(--r-sm);background:var(--surface);color:inherit;
}
.acts button:hover{border-color:var(--ink)}
.acts .del{color:var(--late)}
.acts .del:hover{border-color:var(--late)}

/* ---------- empty ---------- */
.empty{
  background:var(--surface);border:1px dashed var(--rule-strong);border-radius:var(--r);
  padding:64px 28px;text-align:center;color:var(--muted);
}
.empty p{margin-bottom:18px}
.empty button{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:4px}

/* ---------- form sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.5);display:none;z-index:40}
.scrim.on{display:block}
.sheet{
  position:fixed;inset-block:0;inset-inline-end:0;width:min(480px,100%);
  background:var(--surface);z-index:50;overflow-y:auto;
  transform:translateX(-100%);transition:transform .24s ease;
  box-shadow:-16px 0 48px rgba(0,0,0,.2);
}
.sheet.on{transform:translateX(0)}
.sheet-head{
  display:flex;align-items:center;padding:20px 28px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:var(--surface);z-index:1;
}
.sheet-head h2{font-size:17px;font-weight:600;flex:1}
.sheet-head .x{font-size:24px;color:var(--muted);line-height:1;padding:0 6px}
form{padding:24px 28px 52px;display:flex;flex-direction:column;gap:18px}
.f label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:7px}
.f input,.f select,.f textarea{
  width:100%;padding:11px 14px;border:1px solid var(--rule-strong);border-radius:var(--r-sm);
  background:var(--surface-2);font-size:15px;
}
.f textarea{min-height:110px;resize:vertical;line-height:1.65}
.f input:focus,.f select:focus,.f textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface);
}
.pair{display:flex;gap:16px}
.pair .f{flex:1;min-width:0}
.save{
  background:var(--accent);color:var(--accent-ink);font-weight:600;padding:13px;
  border-radius:var(--r-sm);font-size:15.5px;margin-top:6px;
}
.save:hover{opacity:.9}
.save:disabled{opacity:.5;cursor:default}

/* ---------- identity picker ---------- */
.picker{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);
  padding:30px 32px;width:min(400px,calc(100% - 40px));z-index:60;text-align:center;
}
.picker h2{font-size:19px;font-weight:600;margin-bottom:6px}
.picker p{font-size:13.5px;color:var(--muted);margin-bottom:22px}
.picker-opts{display:flex;flex-direction:column;gap:9px}
.picker-opts button{
  padding:13px;border:1px solid var(--rule-strong);border-radius:var(--r-sm);
  background:var(--surface-2);font-size:15.5px;font-weight:500;color:inherit;
}
.picker-opts button:hover{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- misc ---------- */
.banner{
  background:var(--late-bg);border-bottom:1px solid var(--rule);color:var(--late);
  padding:14px 34px;font-size:14px;
}
.banner code{background:rgba(128,128,128,.16);padding:2px 6px;border-radius:4px;font-size:13px}
.foot{max-width:1340px;margin:0 auto;padding:0 30px 48px;display:flex;gap:20px;font-size:13.5px;color:var(--muted)}
.foot button{color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.foot button:hover{color:var(--ink)}
.foot .sync{margin-inline-start:auto}

@media(max-width:900px){
  .shell{flex-direction:column}
  .rail{width:100%;position:static;padding:22px 20px 0;display:flex;flex-wrap:wrap;gap:0 26px;align-items:flex-start}
  .rail .fgroup{flex:1;min-width:160px}
  .rail h3{margin-top:0}
  .list{padding:24px 20px 80px}
  .top{padding:14px 20px;gap:12px}
  .cell{padding:16px 20px;min-width:120px}
  .cell .n{font-size:24px}
  .foot{padding:0 20px 34px;flex-wrap:wrap}
  .banner{padding:12px 20px}
}
</style>
</head>
<body>
<script>
(function(){
  var t; try{ t = JSON.parse(localStorage.getItem("theme")); }catch(e){}
  if(t!=="light" && t!=="dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
})();
</script>

<header class="top">

<div class="shell">
  <aside class="rail">

  <div class="picker-opts" id="whoOpts"></div>
</div>
<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-head">
    <h2 id="sheetTitle">مهمة جديدة</h2>
    <button class="x" id="sheetX" aria-label="إغلاق">&times;</button>
  </div>

    <div class="f">
      <label for="f_title">المهمة</label>
      <input id="f_title" required placeholder="اكتب المطلوب في سطر واحد">
    </div>
    <div class="f">
      <label for="f_details">التفاصيل</label>
      <textarea id="f_details" placeholder="الخطوات، الأرقام، اللينكات، أي حاجة تفتكرها بعدين"></textarea>
    </div>

      <div class="f">
        <label for="f_assignee">المسؤول</label>

      </div>

        <label for="f_requester">طالبها</label>
        <input id="f_requester" list="dlPeople" placeholder="مين طلبها">
      </div>

          <option>عادية</option><option>عاجلة</option><option>لاحقاً</option>

        <option>لسه</option><option>جارية</option><option>متوقفة</option><option>خلصت</option>
      </select>
    </div>
    <datalist id="dlPeople"></datalist>
    <button class="save" type="submit" id="saveBtn">حفظ المهمة</button>
  </form>
</aside>

<script type="module">
const C = window.CONFIG;
const STATUSES = ["لسه","جارية","متوقفة","خلصت"];

/* ─────────── التخزين: Supabase أو محلي ─────────── */
let sb = null, mode = "local";
if (C.SUPABASE_URL && C.SUPABASE_ANON_KEY) {
  try {
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    sb = createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
    mode = "cloud";
  } catch (e) {
    console.error("supabase client failed:", e);
    window.__sbLoadError = e?.message || String(e);
  }
}

const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let memTasks = LS.get("tasks_local", []);

const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16); }));

const store = {
  async list(){
    if (mode === "cloud") {
      const { data, error } = await sb.from("tasks").select("*").eq("archived", false);
      if (error) throw error;
      return data;
    }
    return memTasks.filter(t => !t.archived);
  },
  async upsert(t){
    if (mode === "cloud") {
      const { error } = await sb.from("tasks").upsert(t);
      if (error) throw error;
    } else {
      const i = memTasks.findIndex(x => x.id === t.id);
      if (i > -1) memTasks[i] = { ...memTasks[i], ...t }; else memTasks.push(t);
      LS.set("tasks_local", memTasks);
    }
  },
  async remove(id){
    if (mode === "cloud") {
      const { error } = await sb.from("tasks").delete().eq("id", id);
      if (error) throw error;
    } else {
      memTasks = memTasks.filter(t => t.id !== id);
      LS.set("tasks_local", memTasks);
    }
  }
};

/* ─────────── الحالة ─────────── */
let tasks = [];
let me = LS.get("me", null);
let editing = null;
let openIds = new Set();
let closedGroups = new Set(LS.get("closedGroups", []));
const filters = { person: "all", status: "open", q: "" };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parseDate = s => { if (!s) return null; const d = new Date(s + "T00:00:00"); return isNaN(d) ? null : d; };
const daysLeft = s => { const d = parseDate(s); return d === null ? null : Math.round((d - today()) / 86400000); };

function dueLabel(s){
  const n = daysLeft(s);
  if (n === null) return "";
  const d = parseDate(s);
  const fmt = d.toLocaleDateString("ar-EG", { day:"numeric", month:"short" });
  if (n < 0)  return { txt:`متأخرة ${Math.abs(n)} يوم — ${fmt}`, cls:"late" };
  if (n === 0) return { txt:"النهاردة", cls:"soon" };
  if (n === 1) return { txt:"بكرة", cls:"soon" };
  if (n <= 3) return { txt:`باقي ${n} أيام — ${fmt}`, cls:"soon" };
  return { txt:fmt, cls:"" };
}
const canEdit = t => (C.ADMINS || []).includes(me) || t.assignee === me;
const isLate = t => t.status !== "خلصت" && daysLeft(t.due_date) !== null && daysLeft(t.due_date) < 0;

/* ─────────── من أنت ─────────── */
function renderWho(){
  const el = $("#who");
  el.hidden = false;
  el.innerHTML = me
    ? `<span>أنت: <b>${esc(me)}</b></span><button id="chgMe">تغيير</button>`
    : `<button id="chgMe" style="opacity:1">حدد اسمك</button>`;
  $("#chgMe").onclick = askMe;
}
function askMe(){
  const opts = $("#whoOpts");
  opts.innerHTML = (C.TEAM || []).map(n => `<button data-n="${esc(n)}">${esc(n)}</button>`).join("");
  opts.querySelectorAll("button").forEach(b => b.onclick = () => {
    me = b.dataset.n; LS.set("me", me);
    $("#whoPicker").hidden = true; $("#whoScrim").classList.remove("on");
    renderWho(); renderFilters(); render();
  });
  $("#whoPicker").hidden = false; $("#whoScrim").classList.add("on");
}
$("#whoScrim").onclick = () => {
  if (me) { $("#whoPicker").hidden = true; $("#whoScrim").classList.remove("on"); }
};

/* ─────────── الفلاتر ─────────── */
function radios(container, name, opts){
  container.innerHTML = opts.map(([v, l]) => `
    <label><input type="radio" name="${name}" value="${esc(v)}"${filters[name]===v?" checked":""}>
    <span>${esc(l)}</span></label>`).join("");
  container.querySelectorAll("input").forEach(i => i.onchange = () => { filters[name] = i.value; render(); });
}
function renderFilters(){
  const people = C.TEAM || [];
  radios($("#fPerson"), "person",
    [["all","الكل"], ...(me ? [["__me__","اللي عليا"]] : []), ...people.filter(p=>p!==me).map(p=>[p,p])]);
  radios($("#fStatus"), "status",
    [["open","المفتوحة"],["all","الكل"], ...STATUSES.map(s=>[s,s])]);
  $("#dlPeople").innerHTML = people.map(p=>`<option value="${esc(p)}">`).join("");
  $("#f_assignee").innerHTML = people.map(p=>`<option>${esc(p)}</option>`).join("");
}

function visible(){
  const q = filters.q.trim().toLowerCase();
  return tasks.filter(t => {
    if (filters.person === "__me__") { if (t.assignee !== me) return false; }
    else if (filters.person !== "all" && t.assignee !== filters.person) return false;
    if (filters.status === "open") { if (t.status === "خلصت") return false; }
    else if (filters.status !== "all" && t.status !== filters.status) return false;
    if (q) {
      const hay = [t.title, t.details, t.assignee, t.requester].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ─────────── الشريط العلوي ─────────── */
function renderLedger(){
  const mine = me ? tasks.filter(t => t.assignee === me) : tasks;
  const open = mine.filter(t => t.status !== "خلصت");
  const late = open.filter(isLate).length;
  const wk = new Date(); wk.setDate(wk.getDate() - 7);
  const doneWk = mine.filter(t => t.status === "خلصت" && t.completed_at && new Date(t.completed_at) >= wk).length;
  const cells = [
    [open.filter(t=>t.status==="لسه").length, "لسه ماتعملتش", ""],
    [open.filter(t=>t.status==="جارية").length, "شغالة دلوقتي", ""],
    [late, "متأخرة", "is-late"],
    [doneWk, "خلصت آخر ٧ أيام", ""]
  ];
  $("#ledger").innerHTML = cells.map(([n,l,c]) =>
    `<div class="cell ${c}"><span class="n">${n}</span><span class="l">${l}</span></div>`).join("");
}

/* ─────────── القائمة ─────────── */
const PRI_RANK = { "عاجلة":0, "عادية":1, "لاحقاً":2 };
function sortTasks(a, b){
  const la = isLate(a), lb = isLate(b);
  if (la !== lb) return la ? -1 : 1;
  const pa = PRI_RANK[a.priority] ?? 1, pb = PRI_RANK[b.priority] ?? 1;
  if (pa !== pb) return pa - pb;
  const da = a.due_date || "9999-12-31", db = b.due_date || "9999-12-31";
  if (da !== db) return da < db ? -1 : 1;
  return (b.created_at || "") < (a.created_at || "") ? -1 : 1;
}

function render(){
  renderLedger();
  const rows = visible().sort(sortTasks);
  const list = $("#list");

  if (!rows.length){
    list.innerHTML = `<div class="empty"><p>${tasks.length ? "مفيش مهام مطابقة للفلاتر دي." : "لسه مفيش مهام. ابدأ بأول واحدة."}</p>
      <button id="emptyAdd">${tasks.length ? "امسح الفلاتر" : "إضافة مهمة"}</button></div>`;
    $("#emptyAdd").onclick = () => {
      if (tasks.length){ filters.person="all"; filters.project="all"; filters.status="open"; filters.q=""; $("#q").value=""; renderFilters(); render(); }
      else openSheet();
    };
    return;
  }

  const groups = [
    ["late",  "متأخرة",  rows.filter(isLate)],
    ["جارية", "شغالة دلوقتي", rows.filter(t => !isLate(t) && t.status === "جارية")],
    ["لسه",   "لسه ماتعملتش", rows.filter(t => !isLate(t) && t.status === "لسه")],
    ["متوقفة","متوقفة",   rows.filter(t => !isLate(t) && t.status === "متوقفة")],
    ["خلصت",  "خلصت",     rows.filter(t => t.status === "خلصت")]
  ].filter(g => g[2].length);

  list.innerHTML = groups.map(([k, label, items]) => `
    <div class="group${closedGroups.has(k) ? " closed" : ""}" data-k="${k}">
      <button class="group-head" data-g="${k}">
        <span class="t">${label}</span><span class="c">${items.length}</span>
        <span class="chev">▾</span>
      </button>
      <div class="rows">${items.map(rowHTML).join("")}</div>
    </div>`).join("");

  list.querySelectorAll(".group-head").forEach(b => b.onclick = () => {
    const k = b.dataset.g;
    closedGroups.has(k) ? closedGroups.delete(k) : closedGroups.add(k);
    LS.set("closedGroups", [...closedGroups]); render();
  });
  list.querySelectorAll(".item .main").forEach(b => b.onclick = () => {
    const id = b.closest(".item").dataset.id;
    openIds.has(id) ? openIds.delete(id) : openIds.add(id);
    render();
  });
  list.querySelectorAll(".st").forEach(s => s.onchange = () => changeStatus(s.closest(".item").dataset.id, s.value));
  list.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openSheet(b.dataset.edit));
  list.querySelectorAll("[data-del]").forEach(b => b.onclick = () => del(b.dataset.del));
}

function rowHTML(t){
  const d = dueLabel(t.due_date);
  const meta = [
    t.assignee ? `<span>${esc(t.assignee)}</span>` : "",
    t.priority === "عاجلة" ? `<span class="pri">عاجلة</span>` : "",
    d ? `<span class="due ${d.cls}">${esc(d.txt)}</span>` : ""
  ].filter(Boolean).join("");

  const head = `
      <div class="row">
        <button class="main">
          <div class="title">${esc(t.title)}</div>
          ${meta ? `<div class="meta">${meta}</div>` : ""}
        </button>
        <select class="st" aria-label="الحالة"${canEdit(t) ? "" : ' disabled title="المهمة دي على ' + esc(t.assignee || "حد تاني") + '"'}>
          ${STATUSES.map(s => `<option${s === t.status ? " selected" : ""}>${s}</option>`).join("")}
        </select>
      </div>`;

  let body = "";
  if (openIds.has(t.id)) {
    const dl = [
      t.requester ? `<div><span>طلبها</span><b>${esc(t.requester)}</b></div>` : "",
      t.created_at ? `<div><span>اتسجلت</span><b>${new Date(t.created_at).toLocaleDateString("ar-EG")}</b></div>` : "",
      t.completed_at ? `<div><span>خلصت</span><b>${new Date(t.completed_at).toLocaleDateString("ar-EG")}</b></div>` : ""
    ].filter(Boolean).join("");
    body = `
      <div class="detail">
        <div class="notes">${esc(t.details || "")}</div>
        ${dl ? `<dl>${dl}</dl>` : ""}
        ${canEdit(t)
          ? `<div class="acts">
               <button data-edit="${t.id}">تعديل</button>
               <button class="del" data-del="${t.id}">حذف</button>
             </div>`
          : `<div class="locked">المهمة دي على ${esc(t.assignee || "حد تاني")} — هو اللي يقدر يعدّلها.</div>`}
      </div>`;
  }

  return `<div class="item${isLate(t) ? " late" : ""}" data-s="${esc(t.status)}" data-id="${t.id}">${head}${body}</div>`;
}

/* ─────────── الإجراءات ─────────── */
async function changeStatus(id, status){
  const t = tasks.find(x => x.id === id); if (!t) return;
  if (!canEdit(t)) { flash("المهمة دي مش عليك", true); render(); return; }
  t.status = status;
  t.completed_at = status === "خلصت" ? new Date().toISOString() : null;
  t.updated_at = new Date().toISOString();
  render();
  try { await store.upsert(t); flash("اتحفظت"); } catch(e){ flash("مشكلة في الحفظ", true); load(); }
}

async function del(id){
  const t = tasks.find(x => x.id === id);
  if (t && !canEdit(t)) { flash("المهمة دي مش عليك", true); return; }
  if (!confirm(`تحذف "${t?.title ?? ""}"؟`)) return;
  tasks = tasks.filter(x => x.id !== id); render();
  try { await store.remove(id); flash("اتحذفت"); } catch(e){ flash("مشكلة في الحذف", true); load(); }
}

/* ─────────── نموذج الإضافة/التعديل ─────────── */
function openSheet(id){
  editing = id ? tasks.find(t => t.id === id) : null;
  if (editing && !canEdit(editing)) { flash("المهمة دي مش عليك", true); return; }
  $("#sheetTitle").textContent = editing ? "تعديل المهمة" : "مهمة جديدة";
  $("#f_title").value     = editing?.title ?? "";
  $("#f_details").value   = editing?.details ?? "";
  $("#f_assignee").value  = editing?.assignee ?? me ?? (C.TEAM||[])[0] ?? "";
  $("#f_requester").value = editing?.requester ?? "";
  $("#f_due").value       = editing?.due_date ?? "";
  $("#f_priority").value  = editing?.priority ?? "عادية";
  $("#f_status").value    = editing?.status ?? "لسه";
  $("#sheet").classList.add("on"); $("#sheet").setAttribute("aria-hidden","false");
  $("#scrim").classList.add("on");
  setTimeout(() => $("#f_title").focus(), 180);
}
function closeSheet(){
  $("#sheet").classList.remove("on"); $("#sheet").setAttribute("aria-hidden","true");
  $("#scrim").classList.remove("on"); editing = null;
}

$("#form").onsubmit = async e => {
  e.preventDefault();
  const now = new Date().toISOString();
  const status = $("#f_status").value;
  const t = {
    id: editing?.id ?? uuid(),
    title: $("#f_title").value.trim(),
    details: $("#f_details").value.trim() || null,
    assignee: $("#f_assignee").value.trim() || null,
    requester: $("#f_requester").value.trim() || null,
    project: "API360",
    due_date: $("#f_due").value || null,
    priority: $("#f_priority").value,
    status,
    archived: false,
    created_at: editing?.created_at ?? now,
    updated_at: now,
    completed_at: status === "خلصت" ? (editing?.completed_at ?? now) : null
  };
  if (!t.title) return;
  $("#saveBtn").disabled = true;
  const i = tasks.findIndex(x => x.id === t.id);
  i > -1 ? tasks[i] = t : tasks.unshift(t);
  closeSheet(); renderFilters(); render();
  try { await store.upsert(t); flash("اتحفظت"); } catch(err){ flash("مشكلة في الحفظ", true); load(); }
  $("#saveBtn").disabled = false;
};

const ICON = {
  dark: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>`,
  light: `<svg viewBox="0 0 24 24"><path d="M20 14.2A8.2 8.2 0 1 1 9.8 4a6.6 6.6 0 0 0 10.2 10.2z"/></svg>`
};
function setTheme(t){
  document.documentElement.dataset.theme = t;
  LS.set("theme", t);
  $("#themeBtn").innerHTML = ICON[t];
}
setTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
$("#themeBtn").onclick = () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

$("#newBtn").onclick = () => openSheet();
$("#sheetX").onclick = closeSheet;
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

let qt;
$("#q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => { filters.q = e.target.value; render(); }, 160); };

/* ─────────── تصدير ─────────── */
$("#csvBtn").onclick = () => {
  const cols = [["title","المهمة"],["assignee","المسؤول"],["requester","طالبها"],["priority","الأولوية"],["status","الحالة"],["due_date","التسليم"],
                ["completed_at","تاريخ الإنهاء"],["details","التفاصيل"]];
  const cell = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const csv = "\uFEFF" + [cols.map(c => cell(c[1])).join(",")]
    .concat(visible().sort(sortTasks).map(t => cols.map(c => cell(t[c[0]])).join(","))).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv;charset=utf-8" }));
  a.download = `المهام-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
};

/* ─────────── التحميل والمزامنة ─────────── */
let flashT;
function flash(msg, bad){
  const el = $("#sync");
  el.textContent = msg; el.style.color = bad ? "var(--late)" : "var(--muted)";
  clearTimeout(flashT); flashT = setTimeout(() => { el.textContent = ""; }, 2600);
}

async function load(){
  try {
    tasks = await store.list();
  } catch(e){
    console.error(e);
    const why = [e?.message, e?.hint, e?.details, e?.code].filter(Boolean).join(" — ")
              || (typeof e === "string" ? e : JSON.stringify(e));
    $("#banner").innerHTML = `<div class="banner">مش قادر يوصل لقاعدة البيانات.<br>
      <b>سبب الخطأ:</b> <code>${String(why).replace(/[<>&]/g, "")}</code></div>`;
    tasks = [];
  }
  renderWho(); renderFilters(); render();
}

if (mode === "local") {
  $("#banner").innerHTML = `<div class="banner">شغال محلياً على الجهاز ده بس. عشان الفريق يشوف نفس الداتا، املا <code>SUPABASE_URL</code> و<code>SUPABASE_ANON_KEY</code> فوق في الملف.</div>`;
}

await load();
if (!me) askMe();

if (mode === "cloud") {
  sb.channel("tasks-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"tasks" }, () => load())
    .subscribe();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
}
</script>
</body>
