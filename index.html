<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل المهام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EBEEEC;
  --surface:#FFFFFF;
  --ink:#1B2430;
  --muted:#68746E;
  --rule:#D5DAD6;
  --rule-soft:#E4E8E5;
  --pine:#2F5D50;
  --pine-deep:#22463C;
  --pine-soft:#E1EAE5;
  --done:#4A7A5E;
  --warn:#B4722A;
  --late:#A33B32;
  --late-soft:#F5E7E5;
  --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
  background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.6;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:3px}

/* ---------- header ---------- */
.top{
  background:var(--pine-deep);color:#F2F5F3;
  padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.62;letter-spacing:0}
.top .spacer{flex:1}
.who{
  display:flex;align-items:center;gap:7px;font-size:13.5px;
  background:rgba(255,255,255,.1);padding:5px 11px;border-radius:100px;
}
.who b{font-weight:600}
.who button{color:#F2F5F3;opacity:.6;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.who button:hover{opacity:1}
.btn-new{
  background:#F2F5F3;color:var(--pine-deep);font-weight:600;font-size:14px;
  padding:8px 16px;border-radius:var(--r);
}
.btn-new:hover{background:#fff}

/* ---------- ledger strip ---------- */
.ledger{
  display:flex;background:var(--surface);border-bottom:1px solid var(--rule);
  overflow-x:auto;
}
.cell{
  flex:1;min-width:118px;padding:13px 20px;
  display:flex;align-items:baseline;gap:8px;
  border-inline-start:1px solid var(--rule-soft);
}
.cell:first-child{border-inline-start:none}
.cell .n{font-size:23px;font-weight:600;line-height:1}
.cell .l{font-size:13px;color:var(--muted)}
.cell.is-late .n{color:var(--late)}
.cell.is-late{background:var(--late-soft)}
.cell.is-late .l{color:var(--late)}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start;gap:0;max-width:1240px;margin:0 auto}
.rail{
  width:224px;flex:none;padding:22px 20px 60px;
  position:sticky;top:0;
}
.rail h3{
  font-size:12.5px;font-weight:600;color:var(--muted);
  margin:20px 0 8px;
}
.rail h3:first-child{margin-top:0}
.rail label{display:block;margin-bottom:2px}
.rail label input{position:absolute;opacity:0;pointer-events:none}
.rail label span{
  display:block;padding:5px 10px;border-radius:var(--r);font-size:14px;
  color:var(--ink);
}
.rail label:hover span{background:rgba(0,0,0,.045)}
.rail label input:checked + span{background:var(--pine);color:#fff;font-weight:500}
.rail label input:focus-visible + span{outline:2px solid var(--pine);outline-offset:2px}
.search{
  width:100%;padding:8px 11px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--surface);font-size:14px;
}
.search::placeholder{color:#9AA5A0}

.list{flex:1;min-width:0;padding:22px 20px 80px}

/* ---------- group ---------- */
.group{margin-bottom:26px}
.group-head{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:0 2px 7px;border-bottom:1px solid var(--rule);margin-bottom:1px;
  text-align:start;
}
.group-head .t{font-size:14px;font-weight:600}
.group-head .c{font-size:13px;color:var(--muted)}
.group-head .chev{margin-inline-start:auto;color:var(--muted);font-size:12px;transition:transform .18s}
.group.closed .chev{transform:rotate(-90deg)}
.group.closed .rows{display:none}
.group[data-k="late"] .group-head .t{color:var(--late)}

/* ---------- row ---------- */
.row{
  background:var(--surface);border-bottom:1px solid var(--rule-soft);
  border-inline-start:3px solid var(--rule);
  display:flex;align-items:flex-start;gap:12px;padding:11px 14px;
}
.rows{border-radius:var(--r);overflow:hidden;border:1px solid var(--rule-soft)}
.rows > :last-child{border-bottom:none}
.row[data-s="جارية"]{border-inline-start-color:var(--pine)}
.row[data-s="خلصت"]{border-inline-start-color:var(--done)}
.row[data-s="متوقفة"]{border-inline-start-color:var(--warn)}
.row.late{border-inline-start-color:var(--late)}
.row .main{flex:1;min-width:0;text-align:start}
.row .title{font-size:15px;font-weight:500;line-height:1.45}
.row[data-s="خلصت"] .title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.row .meta{
  font-size:12.5px;color:var(--muted);margin-top:3px;
  display:flex;flex-wrap:wrap;gap:4px 14px;
}
.row .meta .due.late{color:var(--late);font-weight:600}
.row .meta .due.soon{color:var(--warn);font-weight:600}
.row .meta .pri{color:var(--late);font-weight:600}
.st{
  flex:none;border:1px solid var(--rule);border-radius:var(--r);
  padding:4px 8px;font-size:13px;background:var(--surface);
}

/* ---------- detail ---------- */
.detail{
  background:#F7F9F8;border-bottom:1px solid var(--rule-soft);
  border-inline-start:3px solid var(--rule);
  padding:2px 14px 14px;font-size:14px;
}
.detail .notes{white-space:pre-wrap;color:#39444D;padding:6px 0 10px;max-width:70ch}
.detail .notes:empty{display:none}
.detail dl{display:flex;flex-wrap:wrap;gap:4px 26px;font-size:13px;color:var(--muted);padding-bottom:10px}
.detail dl div{display:flex;gap:6px}
.detail dl b{font-weight:500;color:var(--ink)}
.acts{display:flex;gap:8px}
.acts button{
  font-size:13px;padding:5px 12px;border:1px solid var(--rule);
  border-radius:var(--r);background:var(--surface);
}
.acts button:hover{border-color:var(--ink)}
.acts .del{color:var(--late);border-color:#E5C9C6}
.acts .del:hover{border-color:var(--late)}

/* ---------- empty ---------- */
.empty{
  background:var(--surface);border:1px dashed var(--rule);border-radius:var(--r);
  padding:44px 24px;text-align:center;color:var(--muted);
}
.empty p{margin-bottom:14px}
.empty button{
  color:var(--pine);font-weight:600;text-decoration:underline;text-underline-offset:3px;
}

/* ---------- form sheet ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(27,36,48,.42);
  display:none;z-index:40;
}
.scrim.on{display:block}
.sheet{
  position:fixed;inset-block:0;inset-inline-end:0;width:min(440px,100%);
  background:var(--surface);z-index:50;overflow-y:auto;
  transform:translateX(100%);transition:transform .22s ease;
  box-shadow:-14px 0 40px rgba(27,36,48,.16);
}
html[dir="rtl"] .sheet{transform:translateX(-100%)}
.sheet.on{transform:translateX(0)!important}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-head{
  display:flex;align-items:center;padding:16px 22px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:var(--surface);z-index:1;
}
.sheet-head h2{font-size:16px;font-weight:600;flex:1}
.sheet-head .x{font-size:22px;color:var(--muted);line-height:1;padding:0 4px}
form{padding:18px 22px 40px;display:flex;flex-direction:column;gap:14px}
.f label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{
  width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--surface);font-size:14.5px;
}
.f textarea{min-height:92px;resize:vertical;line-height:1.6}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-soft)}
.pair{display:flex;gap:12px}
.pair .f{flex:1;min-width:0}
.save{
  background:var(--pine);color:#fff;font-weight:600;padding:11px;border-radius:var(--r);
  font-size:15px;margin-top:4px;
}
.save:hover{background:var(--pine-deep)}
.save:disabled{opacity:.5;cursor:default}

/* ---------- misc ---------- */
.banner{
  background:#FDF3E3;border-bottom:1px solid #E9D5AE;color:#6B4A14;
  padding:9px 22px;font-size:13.5px;
}
.banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:3px;font-size:12.5px}
.foot{
  max-width:1240px;margin:0 auto;padding:0 20px 40px;
  display:flex;gap:16px;font-size:13px;color:var(--muted);
}
.foot button{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.foot button:hover{color:var(--ink)}
.foot .sync{margin-inline-start:auto}

@media(max-width:860px){
  .shell{flex-direction:column}
  .rail{width:100%;position:static;padding:16px 16px 0;display:flex;flex-wrap:wrap;gap:0 22px;align-items:flex-start}
  .rail .fgroup{flex:1;min-width:150px}
  .rail h3{margin-top:0}
  .rail .fgroup:has(.search){flex-basis:100%}
  .list{padding:18px 16px 70px}
  .top{padding:12px 16px;gap:10px}
  .brand{font-size:16px}
  .cell{padding:11px 16px;min-width:104px}
  .cell .n{font-size:20px}
  .foot{padding:0 16px 30px;flex-wrap:wrap}
}
</style>
</head>

<script type="module">
const C = window.CONFIG;
const STATUSES = ["لسه","جارية","متوقفة","خلصت"];

/* ─────────── التخزين: Supabase أو محلي ─────────── */
let sb = null, mode = "local";
if (C.SUPABASE_URL && C.SUPABASE_ANON_KEY) {
  try {
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    sb = createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
    mode = "cloud";
  } catch (e) {
    console.error("supabase client failed:", e);
    window.__sbLoadError = e?.message || String(e);
  }
}

const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let memTasks = LS.get("tasks_local", []);

const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16); }));

const store = {
  async list(){
    if (mode === "cloud") {
      const { data, error } = await sb.from("tasks").select("*").eq("archived", false);
      if (error) throw error;
      return data;
    }
    return memTasks.filter(t => !t.archived);
  },
  async upsert(t){
    if (mode === "cloud") {
      const { error } = await sb.from("tasks").upsert(t);
      if (error) throw error;
    } else {
      const i = memTasks.findIndex(x => x.id === t.id);
      if (i > -1) memTasks[i] = { ...memTasks[i], ...t }; else memTasks.push(t);
      LS.set("tasks_local", memTasks);
    }
  },
  async remove(id){
    if (mode === "cloud") {
      const { error } = await sb.from("tasks").delete().eq("id", id);
      if (error) throw error;
    } else {
      memTasks = memTasks.filter(t => t.id !== id);
      LS.set("tasks_local", memTasks);
    }
  }
};

/* ─────────── الحالة ─────────── */
let tasks = [];
let me = LS.get("me", null);
let editing = null;
let openIds = new Set();
let closedGroups = new Set(LS.get("closedGroups", []));
const filters = { person: "all", project: "all", status: "open", q: "" };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parseDate = s => { if (!s) return null; const d = new Date(s + "T00:00:00"); return isNaN(d) ? null : d; };
const daysLeft = s => { const d = parseDate(s); return d === null ? null : Math.round((d - today()) / 86400000); };

function dueLabel(s){
  const n = daysLeft(s);
  if (n === null) return "";
  const d = parseDate(s);
  const fmt = d.toLocaleDateString("ar-EG", { day:"numeric", month:"short" });
  if (n < 0)  return { txt:`متأخرة ${Math.abs(n)} يوم — ${fmt}`, cls:"late" };
  if (n === 0) return { txt:"النهاردة", cls:"soon" };
  if (n === 1) return { txt:"بكرة", cls:"soon" };
  if (n <= 3) return { txt:`باقي ${n} أيام — ${fmt}`, cls:"soon" };
  return { txt:fmt, cls:"" };
}
const isLate = t => t.status !== "خلصت" && daysLeft(t.due_date) !== null && daysLeft(t.due_date) < 0;

/* ─────────── من أنت ─────────── */
function renderWho(){
  const el = $("#who");
  el.hidden = false;
  el.innerHTML = me
    ? `<span>أنت: <b>${esc(me)}</b></span><button id="chgMe">تغيير</button>`
    : `<button id="chgMe" style="opacity:1">حدد اسمك</button>`;
  $("#chgMe").onclick = askMe;
}
function askMe(){
  const names = [...new Set([...(C.TEAM||[]), ...tasks.map(t=>t.assignee).filter(Boolean)])];
  const v = prompt("اسمك؟" + (names.length ? "\n(" + names.join(" / ") + ")" : ""), me || "");
  if (v && v.trim()) { me = v.trim(); LS.set("me", me); renderWho(); renderFilters(); render(); }
}

/* ─────────── الفلاتر ─────────── */
function radios(container, name, opts){
  container.innerHTML = opts.map(([v, l]) => `
    <label><input type="radio" name="${name}" value="${esc(v)}"${filters[name]===v?" checked":""}>
    <span>${esc(l)}</span></label>`).join("");
  container.querySelectorAll("input").forEach(i => i.onchange = () => { filters[name] = i.value; render(); });
}
function renderFilters(){
  const people = [...new Set([...(C.TEAM||[]), ...tasks.map(t=>t.assignee).filter(Boolean)])];
  const projects = [...new Set([...(C.PROJECTS||[]), ...tasks.map(t=>t.project).filter(Boolean)])];
  radios($("#fPerson"), "person",
    [["all","الكل"], ...(me ? [["__me__","اللي عليا"]] : []), ...people.filter(p=>p!==me).map(p=>[p,p])]);
  radios($("#fProject"), "project", [["all","الكل"], ...projects.map(p=>[p,p])]);
  radios($("#fStatus"), "status",
    [["open","المفتوحة"],["all","الكل"], ...STATUSES.map(s=>[s,s])]);
  $("#dlPeople").innerHTML = people.map(p=>`<option value="${esc(p)}">`).join("");
  $("#dlProjects").innerHTML = projects.map(p=>`<option value="${esc(p)}">`).join("");
}

function visible(){
  const q = filters.q.trim().toLowerCase();
  return tasks.filter(t => {
    if (filters.person === "__me__") { if (t.assignee !== me) return false; }
    else if (filters.person !== "all" && t.assignee !== filters.person) return false;
    if (filters.project !== "all" && t.project !== filters.project) return false;
    if (filters.status === "open") { if (t.status === "خلصت") return false; }
    else if (filters.status !== "all" && t.status !== filters.status) return false;
    if (q) {
      const hay = [t.title, t.details, t.assignee, t.requester, t.project].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ─────────── الشريط العلوي ─────────── */
function renderLedger(){
  const mine = me ? tasks.filter(t => t.assignee === me) : tasks;
  const open = mine.filter(t => t.status !== "خلصت");
  const late = open.filter(isLate).length;
  const wk = new Date(); wk.setDate(wk.getDate() - 7);
  const doneWk = mine.filter(t => t.status === "خلصت" && t.completed_at && new Date(t.completed_at) >= wk).length;
  const cells = [
    [open.filter(t=>t.status==="لسه").length, "لسه ماتعملتش", ""],
    [open.filter(t=>t.status==="جارية").length, "شغالة دلوقتي", ""],
    [late, "متأخرة", "is-late"],
    [doneWk, "خلصت آخر ٧ أيام", ""]
  ];
  $("#ledger").innerHTML = cells.map(([n,l,c]) =>
    `<div class="cell ${c}"><span class="n">${n}</span><span class="l">${l}</span></div>`).join("");
}

/* ─────────── القائمة ─────────── */
const PRI_RANK = { "عاجلة":0, "عادية":1, "لاحقاً":2 };
function sortTasks(a, b){
  const la = isLate(a), lb = isLate(b);
  if (la !== lb) return la ? -1 : 1;
  const pa = PRI_RANK[a.priority] ?? 1, pb = PRI_RANK[b.priority] ?? 1;
  if (pa !== pb) return pa - pb;
  const da = a.due_date || "9999-12-31", db = b.due_date || "9999-12-31";
  if (da !== db) return da < db ? -1 : 1;
  return (b.created_at || "") < (a.created_at || "") ? -1 : 1;
}

function render(){
  renderLedger();
  const rows = visible().sort(sortTasks);
  const list = $("#list");

  if (!rows.length){
    list.innerHTML = `<div class="empty"><p>${tasks.length ? "مفيش مهام مطابقة للفلاتر دي." : "لسه مفيش مهام. ابدأ بأول واحدة."}</p>
      <button id="emptyAdd">${tasks.length ? "امسح الفلاتر" : "إضافة مهمة"}</button></div>`;
    $("#emptyAdd").onclick = () => {
      if (tasks.length){ filters.person="all"; filters.project="all"; filters.status="open"; filters.q=""; $("#q").value=""; renderFilters(); render(); }
      else openSheet();
    };
    return;
  }

  const groups = [
    ["late",  "متأخرة",  rows.filter(isLate)],
    ["جارية", "شغالة دلوقتي", rows.filter(t => !isLate(t) && t.status === "جارية")],
    ["لسه",   "لسه ماتعملتش", rows.filter(t => !isLate(t) && t.status === "لسه")],
    ["متوقفة","متوقفة",   rows.filter(t => !isLate(t) && t.status === "متوقفة")],
    ["خلصت",  "خلصت",     rows.filter(t => t.status === "خلصت")]
  ].filter(g => g[2].length);

  list.innerHTML = groups.map(([k, label, items]) => `
    <div class="group${closedGroups.has(k) ? " closed" : ""}" data-k="${k}">
      <button class="group-head" data-g="${k}">
        <span class="t">${label}</span><span class="c">${items.length}</span>
        <span class="chev">▾</span>
      </button>
      <div class="rows">${items.map(rowHTML).join("")}</div>
    </div>`).join("");

  list.querySelectorAll(".group-head").forEach(b => b.onclick = () => {
    const k = b.dataset.g;
    closedGroups.has(k) ? closedGroups.delete(k) : closedGroups.add(k);
    LS.set("closedGroups", [...closedGroups]); render();
  });
  list.querySelectorAll(".row .main").forEach(b => b.onclick = () => {
    const id = b.closest(".row").dataset.id;
    openIds.has(id) ? openIds.delete(id) : openIds.add(id);
    render();
  });
  list.querySelectorAll(".st").forEach(s => s.onchange = () => changeStatus(s.closest(".row").dataset.id, s.value));
  list.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openSheet(b.dataset.edit));
  list.querySelectorAll("[data-del]").forEach(b => b.onclick = () => del(b.dataset.del));
}

function rowHTML(t){
  const d = dueLabel(t.due_date);
  const meta = [
    t.assignee ? `<span>${esc(t.assignee)}</span>` : "",
    t.project ? `<span>${esc(t.project)}</span>` : "",
    t.priority === "عاجلة" ? `<span class="pri">عاجلة</span>` : "",
    d ? `<span class="due ${d.cls}">${esc(d.txt)}</span>` : ""
  ].filter(Boolean).join("");

  const row = `
    <div class="row${isLate(t) ? " late" : ""}" data-s="${esc(t.status)}" data-id="${t.id}">
      <button class="main">
        <div class="title">${esc(t.title)}</div>
        ${meta ? `<div class="meta">${meta}</div>` : ""}
      </button>
      <select class="st" aria-label="الحالة">
        ${STATUSES.map(s => `<option${s === t.status ? " selected" : ""}>${s}</option>`).join("")}
      </select>
    </div>`;

  if (!openIds.has(t.id)) return row;

  const dl = [
    t.requester ? `<div><span>طلبها</span><b>${esc(t.requester)}</b></div>` : "",
    t.created_at ? `<div><span>اتسجلت</span><b>${new Date(t.created_at).toLocaleDateString("ar-EG")}</b></div>` : "",
    t.completed_at ? `<div><span>خلصت</span><b>${new Date(t.completed_at).toLocaleDateString("ar-EG")}</b></div>` : ""
  ].filter(Boolean).join("");

  return row + `
    <div class="detail">
      <div class="notes">${esc(t.details || "")}</div>
      ${dl ? `<dl>${dl}</dl>` : ""}
      <div class="acts">
        <button data-edit="${t.id}">تعديل</button>
        <button class="del" data-del="${t.id}">حذف</button>
      </div>
    </div>`;
}

/* ─────────── الإجراءات ─────────── */
async function changeStatus(id, status){
  const t = tasks.find(x => x.id === id); if (!t) return;
  t.status = status;
  t.completed_at = status === "خلصت" ? new Date().toISOString() : null;
  t.updated_at = new Date().toISOString();
  render();
  try { await store.upsert(t); flash("اتحفظت"); } catch(e){ flash("مشكلة في الحفظ", true); load(); }
}

async function del(id){
  const t = tasks.find(x => x.id === id);
  if (!confirm(`تحذف "${t?.title ?? ""}"؟`)) return;
  tasks = tasks.filter(x => x.id !== id); render();
  try { await store.remove(id); flash("اتحذفت"); } catch(e){ flash("مشكلة في الحذف", true); load(); }
}

/* ─────────── نموذج الإضافة/التعديل ─────────── */
function openSheet(id){
  editing = id ? tasks.find(t => t.id === id) : null;
  $("#sheetTitle").textContent = editing ? "تعديل المهمة" : "مهمة جديدة";
  $("#f_title").value     = editing?.title ?? "";
  $("#f_details").value   = editing?.details ?? "";
  $("#f_assignee").value  = editing?.assignee ?? me ?? "";
  $("#f_requester").value = editing?.requester ?? "";
  $("#f_project").value   = editing?.project ?? "";
  $("#f_due").value       = editing?.due_date ?? "";
  $("#f_priority").value  = editing?.priority ?? "عادية";
  $("#f_status").value    = editing?.status ?? "لسه";
  $("#sheet").classList.add("on"); $("#sheet").setAttribute("aria-hidden","false");
  $("#scrim").classList.add("on");
  setTimeout(() => $("#f_title").focus(), 180);
}
function closeSheet(){
  $("#sheet").classList.remove("on"); $("#sheet").setAttribute("aria-hidden","true");
  $("#scrim").classList.remove("on"); editing = null;
}

$("#form").onsubmit = async e => {
  e.preventDefault();
  const now = new Date().toISOString();
  const status = $("#f_status").value;
  const t = {
    id: editing?.id ?? uuid(),
    title: $("#f_title").value.trim(),
    details: $("#f_details").value.trim() || null,
    assignee: $("#f_assignee").value.trim() || null,
    requester: $("#f_requester").value.trim() || null,
    project: $("#f_project").value.trim() || null,
    due_date: $("#f_due").value || null,
    priority: $("#f_priority").value,
    status,
    archived: false,
    created_at: editing?.created_at ?? now,
    updated_at: now,
    completed_at: status === "خلصت" ? (editing?.completed_at ?? now) : null
  };
  if (!t.title) return;
  $("#saveBtn").disabled = true;
  const i = tasks.findIndex(x => x.id === t.id);
  i > -1 ? tasks[i] = t : tasks.unshift(t);
  closeSheet(); renderFilters(); render();
  try { await store.upsert(t); flash("اتحفظت"); } catch(err){ flash("مشكلة في الحفظ", true); load(); }
  $("#saveBtn").disabled = false;
};

$("#newBtn").onclick = () => openSheet();
$("#sheetX").onclick = closeSheet;
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

let qt;
$("#q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => { filters.q = e.target.value; render(); }, 160); };

/* ─────────── تصدير ─────────── */
$("#csvBtn").onclick = () => {
  const cols = [["title","المهمة"],["assignee","المسؤول"],["requester","طالبها"],["project","الجهة"],
                ["priority","الأولوية"],["status","الحالة"],["due_date","التسليم"],
                ["completed_at","تاريخ الإنهاء"],["details","التفاصيل"]];
  const cell = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const csv = "\uFEFF" + [cols.map(c => cell(c[1])).join(",")]
    .concat(visible().sort(sortTasks).map(t => cols.map(c => cell(t[c[0]])).join(","))).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv;charset=utf-8" }));
  a.download = `المهام-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
};

/* ─────────── التحميل والمزامنة ─────────── */
let flashT;
function flash(msg, bad){
  const el = $("#sync");
  el.textContent = msg; el.style.color = bad ? "var(--late)" : "var(--muted)";
  clearTimeout(flashT); flashT = setTimeout(() => { el.textContent = ""; }, 2600);
}

async function load(){
  try {
    tasks = await store.list();
  } catch(e){
    console.error(e);
    const why = [e?.message, e?.hint, e?.details, e?.code].filter(Boolean).join(" — ")
              || (typeof e === "string" ? e : JSON.stringify(e));
    $("#banner").innerHTML = `<div class="banner">مش قادر يوصل لقاعدة البيانات.<br>
      <b>سبب الخطأ:</b> <code>${String(why).replace(/[<>&]/g, "")}</code></div>`;
    tasks = [];
  }
  renderWho(); renderFilters(); render();
}

if (mode === "local") {
  $("#banner").innerHTML = `<div class="banner">شغال محلياً على الجهاز ده بس. عشان الفريق يشوف نفس الداتا، املا <code>SUPABASE_URL</code> و<code>SUPABASE_ANON_KEY</code> فوق في الملف.</div>`;
}

await load();
if (!me) askMe();

if (mode === "cloud") {
  sb.channel("tasks-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"tasks" }, () => load())
    .subscribe();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
}
</script>
